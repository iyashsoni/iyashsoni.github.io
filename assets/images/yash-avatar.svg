<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Stylised portrait illustration of Yash Soni in a café">
  <defs>
    <!-- Warm café atmosphere -->
    <radialGradient id="ambient" cx="50%" cy="38%" r="70%">
      <stop offset="0%"  stop-color="#7a4e2a" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#2a1a14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d0807" stop-opacity="1"/>
    </radialGradient>

    <!-- Arch — burnished copper -->
    <linearGradient id="arch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7a4220"/>
      <stop offset="55%"  stop-color="#9a5a2a"/>
      <stop offset="100%" stop-color="#3a1f10"/>
    </linearGradient>
    <linearGradient id="archInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#3a2618" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#150c08" stop-opacity="1"/>
    </linearGradient>

    <!-- Distant cafe interior glow through arch -->
    <radialGradient id="interiorGlow" cx="50%" cy="65%" r="60%">
      <stop offset="0%"   stop-color="#ffb169" stop-opacity="0.42"/>
      <stop offset="60%"  stop-color="#7a3815" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0b06" stop-opacity="0"/>
    </radialGradient>

    <!-- Industrial ceiling rails (top) -->
    <linearGradient id="ceiling" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#2a1f1a"/>
      <stop offset="100%" stop-color="#0d0807" stop-opacity="0"/>
    </linearGradient>

    <!-- Shirt — maroon / burgundy -->
    <linearGradient id="shirt" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"  stop-color="#a44a5a"/>
      <stop offset="55%" stop-color="#7d2e3f"/>
      <stop offset="100%" stop-color="#4a1626"/>
    </linearGradient>
    <linearGradient id="shirtShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#3a0e1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#280812" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Trousers — warm cream/white -->
    <linearGradient id="pants" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#efe6d4"/>
      <stop offset="100%" stop-color="#b6a78a"/>
    </linearGradient>

    <!-- Floor reflection -->
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#3a261a" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#2a1810" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Rim light — warm key -->
    <linearGradient id="rimLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffc890" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffc890" stop-opacity="0"/>
    </linearGradient>

    <!-- Skin (head silhouette only — no features) — warm wheatish tone -->
    <radialGradient id="skinSil" cx="48%" cy="40%" r="65%">
      <stop offset="0%"   stop-color="#d9a070" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#b97f4e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8a5a34" stop-opacity="1"/>
    </radialGradient>

    <!-- Soft head halo light -->
    <radialGradient id="headHalo" cx="58%" cy="32%" r="55%">
      <stop offset="0%"  stop-color="#ffd9a8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffd9a8" stop-opacity="0"/>
    </radialGradient>

    <!-- Brushy noise on background -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.13  0 0 0 0 0.08  0 0 0 0.18 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Soft blur for atmosphere -->
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Mask: only show interior glow inside the arch -->
    <clipPath id="archClip">
      <path d="
        M 168 332
        Q 168 196 300 196
        Q 432 196 432 332
        L 432 612
        L 168 612 Z"/>
    </clipPath>
  </defs>

  <!-- ── Backdrop ───────────────────────────────── -->
  <rect width="600" height="800" fill="url(#ambient)"/>
  <rect width="600" height="800" fill="url(#ambient)" filter="url(#grain)" opacity="0.6"/>

  <!-- Industrial ceiling slats hint -->
  <g opacity="0.55">
    <rect x="0" y="0" width="600" height="120" fill="url(#ceiling)"/>
    <line x1="40"  y1="22" x2="200" y2="22"  stroke="#1a120c" stroke-width="3" opacity="0.7"/>
    <line x1="220" y1="22" x2="400" y2="22"  stroke="#1a120c" stroke-width="3" opacity="0.6"/>
    <line x1="420" y1="22" x2="580" y2="22"  stroke="#1a120c" stroke-width="3" opacity="0.7"/>
    <line x1="80"  y1="60" x2="520" y2="60"  stroke="#1a120c" stroke-width="2" opacity="0.45"/>
    <!-- hanging filament bulbs -->
    <line x1="180" y1="0" x2="180" y2="86" stroke="#3a2a1c" stroke-width="1"/>
    <circle cx="180" cy="92" r="5" fill="#ffce82" opacity="0.85"/>
    <circle cx="180" cy="92" r="14" fill="#ffce82" opacity="0.18" filter="url(#softBlur)"/>
    <line x1="420" y1="0" x2="420" y2="100" stroke="#3a2a1c" stroke-width="1"/>
    <circle cx="420" cy="106" r="5" fill="#ffce82" opacity="0.85"/>
    <circle cx="420" cy="106" r="14" fill="#ffce82" opacity="0.18" filter="url(#softBlur)"/>
    <line x1="300" y1="0" x2="300" y2="68" stroke="#3a2a1c" stroke-width="1"/>
    <circle cx="300" cy="74" r="4" fill="#ffce82" opacity="0.7"/>
  </g>

  <!-- ── Café Arch ──────────────────────────────── -->
  <!-- Arch outer frame (burnished metal) -->
  <path d="
    M 130 332
    Q 130 168 300 168
    Q 470 168 470 332
    L 470 660
    L 130 660 Z"
    fill="url(#arch)"/>

  <!-- Arch inner cutout (interior view) -->
  <g clip-path="url(#archClip)">
    <rect x="160" y="170" width="280" height="450" fill="url(#archInner)"/>
    <rect x="160" y="170" width="280" height="450" fill="url(#interiorGlow)"/>
    <!-- Distant bar / shelves silhouette -->
    <rect x="178" y="430" width="244" height="120" fill="#2a1810" opacity="0.85"/>
    <rect x="178" y="430" width="244" height="14" fill="#0e0807"/>
    <!-- Bottle rows -->
    <g fill="#ffc88a" opacity="0.5">
      <rect x="195" y="460" width="6" height="22" rx="1.5"/>
      <rect x="207" y="458" width="6" height="24" rx="1.5"/>
      <rect x="219" y="462" width="6" height="20" rx="1.5"/>
      <rect x="231" y="458" width="6" height="24" rx="1.5"/>
      <rect x="243" y="464" width="6" height="18" rx="1.5"/>
      <rect x="255" y="460" width="6" height="22" rx="1.5"/>
      <rect x="267" y="458" width="6" height="24" rx="1.5"/>
      <rect x="279" y="462" width="6" height="20" rx="1.5"/>
      <rect x="291" y="460" width="6" height="22" rx="1.5"/>
      <rect x="303" y="458" width="6" height="24" rx="1.5"/>
      <rect x="315" y="462" width="6" height="20" rx="1.5"/>
      <rect x="327" y="458" width="6" height="24" rx="1.5"/>
      <rect x="339" y="464" width="6" height="18" rx="1.5"/>
      <rect x="351" y="460" width="6" height="22" rx="1.5"/>
      <rect x="363" y="458" width="6" height="24" rx="1.5"/>
      <rect x="375" y="462" width="6" height="20" rx="1.5"/>
      <rect x="387" y="460" width="6" height="22" rx="1.5"/>
      <rect x="399" y="458" width="6" height="24" rx="1.5"/>
    </g>
    <!-- Soft warm halo behind subject -->
    <ellipse cx="300" cy="380" rx="170" ry="150" fill="#ffb169" opacity="0.22" filter="url(#softBlur)"/>
  </g>

  <!-- Arch inner edge highlight -->
  <path d="
    M 168 332
    Q 168 196 300 196
    Q 432 196 432 332"
    fill="none" stroke="#d99a5a" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Plant — left side ornament -->
  <g transform="translate(70 540)" opacity="0.85">
    <ellipse cx="0" cy="44" rx="38" ry="10" fill="#1a100a" opacity="0.6"/>
    <path d="M -16 30 L -14 -10 L 16 -12 L 18 32 Z" fill="#2c1a0e"/>
    <path d="M -10 30 L -8 -8 L 12 -10 L 14 30 Z" fill="#3a2316"/>
    <!-- leaves -->
    <path d="M -2 -8 Q -28 -42 -22 -68 Q -6 -52 -2 -10 Z" fill="#2d4a32"/>
    <path d="M  2 -8 Q  28 -42  22 -68 Q  6 -52  2 -10 Z" fill="#1f3624"/>
    <path d="M -1 -10 Q -8 -56 6 -82 Q 12 -54 1 -10 Z" fill="#345840"/>
    <path d="M  3 -10 Q 22 -56 8 -86 Q 0 -54 3 -10 Z" fill="#264028"/>
  </g>

  <!-- Floor reflection -->
  <rect x="0" y="660" width="600" height="140" fill="url(#floor)"/>
  <ellipse cx="300" cy="700" rx="180" ry="14" fill="#000" opacity="0.55"/>

  <!-- ── Subject — stylised silhouette ─────────── -->

  <!-- Soft warm rim from behind -->
  <ellipse cx="300" cy="360" rx="120" ry="200" fill="#ffb169" opacity="0.18" filter="url(#softBlur)"/>

  <!-- Trousers (white/cream) -->
  <path d="
    M 246 540
    L 240 760
    L 280 760
    L 290 545
    Z" fill="url(#pants)"/>
  <path d="
    M 354 540
    L 360 760
    L 320 760
    L 310 545
    Z" fill="url(#pants)"/>
  <!-- Trouser shadow inner crease -->
  <path d="M 255 555 L 252 760 L 264 760 L 268 555 Z" fill="#7d6f55" opacity="0.35"/>
  <path d="M 345 555 L 348 760 L 336 760 L 332 555 Z" fill="#7d6f55" opacity="0.35"/>

  <!-- Sneakers -->
  <ellipse cx="260" cy="772" rx="32" ry="11" fill="#0c0805" opacity="0.7"/>
  <ellipse cx="340" cy="772" rx="32" ry="11" fill="#0c0805" opacity="0.7"/>
  <path d="M 234 762 Q 234 750 248 748 L 282 750 Q 290 760 286 770 Q 268 776 240 772 Z" fill="#f0e9da"/>
  <path d="M 366 762 Q 366 750 352 748 L 318 750 Q 310 760 314 770 Q 332 776 360 772 Z" fill="#f0e9da"/>
  <line x1="246" y1="757" x2="280" y2="757" stroke="#cabe9e" stroke-width="1"/>
  <line x1="320" y1="757" x2="354" y2="757" stroke="#cabe9e" stroke-width="1"/>

  <!-- Shirt — short sleeves, casual button-up -->
  <path d="
    M 300 380
    Q 250 380 224 408
    Q 206 432 200 472
    L 198 545
    Q 250 558 300 558
    Q 350 558 402 545
    L 400 472
    Q 394 432 376 408
    Q 350 380 300 380 Z" fill="url(#shirt)"/>
  <!-- Shadow under shirt -->
  <path d="
    M 198 545
    Q 250 558 300 558
    Q 350 558 402 545
    L 400 472
    L 198 472 Z" fill="url(#shirtShade)"/>

  <!-- Sleeve cuffs (rolled) -->
  <path d="M 190 460 Q 196 444 220 442 L 232 472 Q 220 478 200 476 Z" fill="#5e1a2c"/>
  <path d="M 410 460 Q 404 444 380 442 L 368 472 Q 380 478 400 476 Z" fill="#5e1a2c"/>

  <!-- Arms — disappearing into pockets -->
  <path d="
    M 196 472
    Q 184 510 196 540
    L 222 542
    Q 224 510 230 478 Z" fill="#7d2e3f"/>
  <path d="
    M 404 472
    Q 416 510 404 540
    L 378 542
    Q 376 510 370 478 Z" fill="#7d2e3f"/>

  <!-- Hands tucked into pockets — pocket flaps -->
  <path d="M 218 535 Q 230 540 246 540 L 250 555 Q 235 555 220 552 Z" fill="#5e1a2c"/>
  <path d="M 382 535 Q 370 540 354 540 L 350 555 Q 365 555 380 552 Z" fill="#5e1a2c"/>
  <!-- Tiny watch hint -->
  <rect x="408" y="528" width="14" height="6" rx="1.5" fill="#1a1410"/>
  <rect x="410" y="529" width="10" height="4" rx="1" fill="#2a201a"/>

  <!-- Collar V-neck -->
  <path d="M 280 380 L 300 412 L 320 380" fill="none" stroke="#3a0e1a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 280 380 L 290 396 L 300 412 L 290 380 Z" fill="#3a0e1a" opacity="0.6"/>
  <path d="M 320 380 L 310 396 L 300 412 L 310 380 Z" fill="#3a0e1a" opacity="0.6"/>
  <!-- Center placket / button line -->
  <line x1="300" y1="412" x2="300" y2="556" stroke="#3a0e1a" stroke-width="1.2" opacity="0.7"/>

  <!-- Buttons -->
  <circle cx="300" cy="438" r="2" fill="#2a0a14"/>
  <circle cx="300" cy="468" r="2" fill="#2a0a14"/>
  <circle cx="300" cy="498" r="2" fill="#2a0a14"/>
  <circle cx="300" cy="528" r="2" fill="#2a0a14"/>

  <!-- Neck -->
  <path d="M 282 348 L 280 380 L 320 380 L 318 348 Z" fill="#b07c4c"/>
  <path d="M 308 348 L 318 348 L 320 380 L 312 380 Z" fill="#7a5028" opacity="0.6"/>

  <!-- Head — stylised silhouette, soft rim, no features -->
  <ellipse cx="300" cy="288" rx="62" ry="76" fill="url(#skinSil)"/>
  <!-- Hair shape — short, slightly volumed -->
  <path d="
    M 246 270
    Q 248 218 286 210
    Q 300 207 314 210
    Q 352 218 354 270
    Q 348 244 326 232
    Q 308 224 300 224
    Q 292 224 274 232
    Q 252 244 246 270 Z" fill="#0a0604"/>
  <!-- Subtle warm rim light on right side of head -->
  <path d="
    M 358 270
    Q 360 234 332 218
    Q 332 248 358 270 Z" fill="#ffd9a8" opacity="0.22"/>
  <!-- Rim along jaw -->
  <path d="M 358 296 Q 354 332 332 354 Q 354 326 360 296 Z" fill="#ffb169" opacity="0.22"/>
  <!-- Halo glow over head -->
  <ellipse cx="318" cy="264" rx="80" ry="76" fill="url(#headHalo)"/>

  <!-- Subtle abstract face suggestion (no real features) — minimal hint of cheek glow only -->
  <ellipse cx="324" cy="296" rx="14" ry="8" fill="#ffb78a" opacity="0.16"/>

  <!-- Ground glow under figure -->
  <ellipse cx="300" cy="690" rx="120" ry="10" fill="#ffb169" opacity="0.18" filter="url(#softBlur)"/>

  <!-- Bokeh dots (cafe lights) -->
  <g fill="#ffce82" opacity="0.85">
    <circle cx="486" cy="222" r="6" filter="url(#softBlur)"/>
    <circle cx="486" cy="222" r="2.5"/>
    <circle cx="118" cy="248" r="5" filter="url(#softBlur)"/>
    <circle cx="118" cy="248" r="2"/>
    <circle cx="76"  cy="402" r="4" filter="url(#softBlur)"/>
    <circle cx="540" cy="378" r="5" filter="url(#softBlur)"/>
    <circle cx="540" cy="378" r="2"/>
  </g>

  <!-- Frame highlight on rim light side -->
  <rect x="0" y="0" width="600" height="800" fill="url(#rimLight)"/>

  <!-- Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="600" height="800" fill="url(#vignette)"/>
</svg>
