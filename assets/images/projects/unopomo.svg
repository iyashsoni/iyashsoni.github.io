<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%"   stop-color="#141420"/>
      <stop offset="100%" stop-color="#08080F"/>
    </radialGradient>
    <linearGradient id="arc" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="arcglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle">
      <rect width="1000" height="1000" rx="224"/>
    </clipPath>
    <radialGradient id="gloss" cx="38%" cy="20%" r="58%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1000" height="1000" fill="url(#bg)"/>

    <!-- Ring track -->
    <circle cx="500" cy="500" r="310" stroke="rgba(255,255,255,0.08)" stroke-width="32" fill="none"/>

    <!-- Cardinal tick marks -->
    <g stroke="rgba(255,255,255,0.20)" stroke-width="6" stroke-linecap="round">
      <line x1="500" y1="158" x2="500" y2="182"/>
      <line x1="500" y1="818" x2="500" y2="842"/>
      <line x1="158" y1="500" x2="182" y2="500"/>
      <line x1="818" y1="500" x2="842" y2="500"/>
    </g>

    <!-- Progress arc ~80% -->
    <circle cx="500" cy="500" r="310"
      stroke="url(#arc)" stroke-width="32" fill="none"
      stroke-linecap="round"
      stroke-dasharray="1554 389"
      stroke-dashoffset="389"
      transform="rotate(-90 500 500)"
      filter="url(#arcglow)"
      opacity="0.90"/>

    <!-- Indigo accent dot at arc tip -->
    <circle cx="500" cy="190" r="20" fill="#6366F1"
      transform="rotate(210 500 500)"
      filter="url(#arcglow)"/>

    <!-- Glass center circle -->
    <circle cx="500" cy="500" r="220"
      fill="rgba(255,255,255,0.04)"
      stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Center hub dot -->
    <circle cx="500" cy="500" r="12" fill="rgba(255,255,255,0.40)"/>

    <!-- Glass highlight -->
    <rect width="1000" height="1000" rx="224" fill="url(#gloss)"/>
    <!-- Inset border -->
    <rect width="1000" height="1000" rx="224" fill="none"
      stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  </g>
</svg>
